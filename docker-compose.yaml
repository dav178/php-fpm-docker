services:
  php:
    image: dhi.io/php:8.2-alpine3.22-fpm    
    container_name: app-php82-fpm
    restart: unless-stopped
    working_dir: /var/www
    mem_limit: 1g
    cpus: 1
    volumes:
      - ./d4craft.com:/var/www
      - ./php-fpm/d4craft.conf:/usr/local/etc/php-fpm.d/www.conf:ro  # Config per site for php-fpm 
    networks:
      - appnet

  nginx:
    image: dhi.io/nginx:1.29
    container_name: app-nginx
    restart: unless-stopped
    depends_on:
      - php
    ports:
      - "8080:80"   # expose locally; behind Cloudflare Tunnel you can remove this and use "expose" instead
    # expose:
    #   - "80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # If you want nginx to serve static files from the same codebase, mount code read-only:
      - ./d4craft.com:/var/www:ro
    networks:
      - appnet

networks:
  appnet:
    driver: bridge
